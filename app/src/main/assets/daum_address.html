<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daum 우편번호 서비스</title>
    <style>
        body { margin: 0; padding: 0; height: 100vh; }
        #wrap { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="wrap"></div>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        // 페이지 로드 시 자동으로 우편번호 검색 실행
        window.onload = function() {
            console.log("페이지 로드됨");
            execDaumPostcode();
        };

        function execDaumPostcode() {
            var element_wrap = document.getElementById('wrap');
            
            try {
                console.log("우편번호 서비스 실행 시도");
                new daum.Postcode({
                    oncomplete: function(data) {
                        console.log("주소 선택 완료", data);
                        
                        // 각 주소의 노출 규칙에 따라 주소를 조합한다.
                        var addr = ''; // 주소 변수
                        var extraAddr = ''; // 참고항목 변수

                        // 사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
                        if (data.userSelectedType === 'R') { // 도로명 주소를 선택했을 경우
                            addr = data.roadAddress;
                        } else { // 지번 주소를 선택했을 경우(J)
                            addr = data.jibunAddress;
                        }

                        // 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
                        if(data.userSelectedType === 'R'){
                            // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                            if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                                extraAddr += data.bname;
                            }
                            // 건물명이 있고, 공동주택일 경우 추가한다.
                            if(data.buildingName !== '' && data.apartment === 'Y'){
                                extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                            }
                            // 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
                            if(extraAddr !== ''){
                                extraAddr = ' (' + extraAddr + ')';
                            }
                        }
                        
                        // 전체 데이터를 JSON으로 만들어 Android로 전달
                        try {
                            var jsonData = JSON.stringify(data);
                            console.log("Android에 전달할 데이터:", jsonData);
                            
                            // 주 인터페이스 함수 호출 시도
                            if (window.Android && typeof window.Android.processDATA === 'function') {
                                window.Android.processDATA(jsonData);
                                console.log("processDATA 함수 호출 성공");
                            } else {
                                console.log("processDATA 함수가 없어 setAddress 함수 시도");
                                // 백업: setAddress 함수 시도
                                if (window.Android && typeof window.Android.setAddress === 'function') {
                                    window.Android.setAddress(addr);
                                    console.log("setAddress 함수 호출 성공");
                                } else {
                                    console.error("Android 인터페이스 함수를 찾을 수 없습니다");
                                    alert("주소 선택 기능에 문제가 발생했습니다.");
                                }
                            }
                        } catch (e) {
                            console.error("Android 인터페이스 호출 오류:", e);
                            alert("주소 데이터 전달 중 오류가 발생했습니다.");
                        }
                    },
                    width: '100%',
                    height: '100%'
                }).embed(element_wrap);
                
                console.log("우편번호 서비스 로드 완료");
            } catch (e) {
                console.error("우편번호 서비스 로드 오류:", e);
                alert("우편번호 서비스를 불러오는데 실패했습니다.");
            }
        }
    </script>
</body>
</html>
